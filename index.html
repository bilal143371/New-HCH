<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakistan HealthCare Hub</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%230284C7%22/><path d=%22M35 30 L35 70 M65 30 L65 70 M35 50 L65 50%22 stroke=%22%23ffffff%22 stroke-width=%2210%22 stroke-linecap=%22round%22/><circle cx=%2250%22 cy=%2235%22 r=%225%22 fill=%22%2310B981%22/></svg>">
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter" inside sandboxed iframes
      try {
        const originalFetch = window.fetch;
        let customFetch = originalFetch;
        
        const defineOn = (obj) => {
          if (obj) {
            try {
              Object.defineProperty(obj, 'fetch', {
                get() {
                  return customFetch;
                },
                set(value) {
                  customFetch = value;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              console.warn("Failed to define fetch on object", err);
            }
          }
        };

        defineOn(window);
        if (typeof globalThis !== 'undefined' && globalThis !== window) {
          defineOn(globalThis);
        }
        if (typeof self !== 'undefined' && self !== window) {
          defineOn(self);
        }
      } catch (e) {
        console.warn("Failed fetch override setup", e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
